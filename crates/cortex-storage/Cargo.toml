[package]
name = "cortex-storage"
description = "Explicit local encrypted persistence for Cortex contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cortex-core = { path = "../cortex-core" }
cortex-evidence = { path = "../cortex-evidence" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
rusqlite = { version = "=0.41.0", features = ["bundled-sqlcipher", "limits"] }
zeroize = "1.9.0"
libc = "0.2"

[lints]
workspace = true
