[package]
name = "cortex-cli"
description = "The Cortex terminal interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-evidence = { path = "../cortex-evidence" }
serde_json = { version = "1.0.154", features = ["raw_value"] }

[target.'cfg(target_os = "linux")'.dependencies]
cortex-harness = { path = "../cortex-harness" }
cortex-storage = { path = "../cortex-storage" }
serde = { version = "1.0.229", features = ["derive"] }
zeroize = "1.9.0"
libc = "0.2"

[lints]
workspace = true
