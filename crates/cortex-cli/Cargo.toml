[package]
name = "cortex-cli"
description = "The Cortex terminal interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-evidence = { path = "../cortex-evidence" }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "=0.41.0", features = ["bundled-sqlcipher", "limits"] }
zeroize = "1.9.0"
libc = "0.2"

[lints]
workspace = true
